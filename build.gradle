plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ComNCheck'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'mysql:mysql-connector-java:8.0.33'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.google.firebase:firebase-admin:8.1.0'

	// QueryDSL core 라이브러리
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta' // jakarta 버전 명시 필수

	// QueryDSL Annotation Processor (Q-Type 생성용)
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"


	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'
	implementation group: 'com.google.cloud', name: 'spring-cloud-gcp-starter', version: '6.0.0'
	implementation group: 'com.google.cloud', name: 'spring-cloud-gcp-storage', version: '6.0.0'
	implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '4.29.3'
}

tasks.named('test') {
	useJUnitPlatform()
}

//Q-type 생성 경로 지정
def generatedDir = 'src/main/generated'

sourceSets {
	main {
		java {
			srcDirs += [ generatedDir ]
		}
	}
}

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(generatedDir))
}

tasks.named('clean') {
	doLast {
		file(generatedDir).deleteDir()
	}
}